<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under 25 Personality Test</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="u25.png" type="image/png">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-container">
        <img src="u25.png" alt="Under 25 Logo" class="logo">
        <h1>Under 25</h1>
      </div>
      <h2 class="quiz-title">What's Your Bizarre Personality?</h2>
    </header>

    <div class="quiz-container">
      <div id="intro" class="section active">
        <h3>Find Out Your True Bizarre Self!</h3>
        <p>Answer these totally scientific and not-at-all random questions to discover what bizarre thing you actually are.</p>
        <button id="start-btn" class="btn">Start Quiz</button>
      </div>

      <div id="quiz" class="section">
        <div class="progress-container">
          <div class="progress-bar">
            <div id="progress" class="progress"></div>
          </div>
          <div id="question-counter">Question 1/10</div>
        </div>
        <div id="question-container"></div>
        <div class="navigation">
          <button id="prev-btn" class="btn nav-btn">Previous</button>
          <button id="next-btn" class="btn nav-btn">Next</button>
        </div>
      </div>

      <div id="result" class="section">
        <h3>Your Results Are In!</h3>
        <div id="result-container">
          <div id="result-image" class="result-image"></div>
          <div id="result-title" class="result-title"></div>
          <div id="result-description" class="result-description"></div>
        </div>
        <button id="restart-btn" class="btn">Take Quiz Again</button>
        <button id="share-btn" class="btn">Share Results</button>
      </div>
    </div>

    <footer>
      <p>Created with ❤️ for Under 25 by <a href='https://www.linkedin.com/in/nishantrana07/'>Nishant Rana</a></p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
