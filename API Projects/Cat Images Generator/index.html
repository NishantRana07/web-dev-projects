<html>
    <head>
        <title>Image Generator</title>
    </head>
    <style>
        *
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        form {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            margin-top:20px;
        }
        form{
            /* From Uiverse.io by alexruix */ 
            .input-group {
            position: relative;
            }

            .input {
            border: solid 1.5px #9e9e9e;
            border-radius: 1rem;
            background: none;
            padding: 1rem;
            font-size: 1rem;
            color: #fffdfd;
            transition: border 150ms cubic-bezier(0.4,0,0.2,1);
            }

            .user-label {
            position: absolute;
            left: 15px;
            color: #ffffff;
            pointer-events: none;
            transform: translateY(1rem);
            transition: 150ms cubic-bezier(0.4,0,0.2,1);
            }

            .input:focus, input:valid {
            outline: none;
            border: 1.5px solid #1a73e8;
            }

            .input:focus ~ label, input:valid ~ label {
            transform: translateY(-50%) scale(0.8);
            background-color: #000000;
            padding: 0 .2em;
            color: #2196f3;
            }
            
            button {
            padding: 0.1em 0.25em;
            width: 13em;
            height: 4.2em;
            background-color: #212121;
            border: 0.08em solid #fff;
            border-radius: 0.3em;
            font-size: 12px;
            cursor: pointer;
            }

            button span {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            bottom: 0.4em;
            width: 8.25em;
            height: 2.5em;
            background-color: #212121;
            border-radius: 0.2em;
            font-size: 1.5em;
            color: #fff;
            border: 0.08em solid #fff;
            box-shadow: 0 0.4em 0.1em 0.019em #fff;
            }

            button span:hover {
            transition: all 0.5s;
            transform: translate(0, 0.4em);
            box-shadow: 0 0 0 0 #fff;
            }

            button span:not(hover) {
            transition: all 1s;
            }
            background-color: #212121;
            height: 250px;
        }
        #image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            padding: 20px;
        }
        #image-container img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            margin: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border: 2px solid #ccc;
        }
    </style>
    <body>
        <div class="container" style="display: flex; justify-content: center; align-items: center;flex-direction:column">
            <form action="#">
                <div class="input-group">
                    <input required="" type="text" name="text" autocomplete="off" class="input">
                    <label class="user-label">Enter Number of Images</label>
                  </div>
                <button >
                    <span> Generate </span>
                </button>
            </form>
            <div id="image-container" style="display: flex; justify-content: center; align-items: center; flex-wrap: wrap;padding:20px;" >
                
                
                
            </div>
        </div>
        
    </body>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
        let num=document.querySelector('.input-group input');
        document.querySelector('form button').addEventListener('click',async ()=>{
                await generateImage(num.value);
                
        })
        async function generateImage(a){
            for (i=0;i<a;i++)
        {
            const response = await fetch('https://api.thecatapi.com/v1/images/search')
            const data = await response.json()
            console.log(data[0].url);
            document.getElementById('image-container').innerHTML+=`<img src="${data[0].url}">`
            console.log(i);
        }
        }
    })
    </script>
</html>
