<html>
    <head>
        <title>Cat Fact</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Jersey+15&display=swap" rel="stylesheet">
    </head>
    <Style>
        *
        {
            margin:0px;
            padding:0px;
        }
        body{
            background-color:aliceblue;
            font-family: 'jersey 15';
            display: flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            flex-wrap: wrap;
            width:100vw;
            min-height:100vh;
        }
        h1{
            text-align: center;
            font-size:4rem;
            position:sticky;
            top:0px;
            margin-bottom:20px;
            z-index:99;
            background-color:#F1F7FE;
            width:100%;
        }

        form{
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            background-color:#F1F7FE;
            border-color:#101112;
            border-width: 4px;
            max-width: fit-content;
            border-style: solid;
            margin:auto auto;
            border-radius:20px;
            padding:30px;
            gap:40px;
            justify-content: space-around;
            input
            {
                height:25px;
                
            }
        }
        #Fact-container
        {
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            gap:20px;
            margin-top:20px;

            #fact
            {
                background-color:#F1F7FE;
                border-color:#101112;
                border-width: 4px;
                border-style: solid;
                margin:auto auto;
                border-radius:20px;
                padding:10px 20px;
                text-align:center;
            }

        }
       
        button {
        border: none;
        outline: none;
        background-color: #6c5ce7;
        padding: 10px 20px;
        font-size: 12px;
        font-weight: 700;
        color: #fff;
        border-radius: 5px;
        transition: all ease 0.1s;
        box-shadow: 0px 5px 0px 0px #a29bfe;
        }

        button:active {
        transform: translateY(5px);
        box-shadow: 0px 0px 0px 0px #a29bfe;
        }
        /* From Uiverse.io by shadowmurphy */ 
        .input {
        border: 2px solid rgba(67, 68, 69, 0.2);
        width: 15em;
        height: 2.5em;
        padding-left: 0.8em;
        outline: none;
        overflow: hidden;
        background-color: #F3F3F3;
        border-radius: 10px;
        transition: all 0.5s;
        }

        .input:hover,
        .input:focus {
        border: 2px solid #4A9DEC;
        box-shadow: 0px 0px 0px 7px rgb(74, 157, 236, 20%);
        background-color: white;
        }

    </Style>
    <body>
        <h1>Cat Fact Generator</h1>
        <div class="container">
            <div class="form">
                <form action="#">
                    <input type="number" placeholder="Enter the number of Facts" class="input">
                    
                    <button>
                        Generate
                    </button>
                </form>
            </div>
            <div id="Fact-container">
                <div id="fact">Hello facts will be shown here 👇</div>
            </div>
        </div>
    </body>

    <Script>
        document.addEventListener('DOMContentLoaded',()=>{
    let container=document.getElementById('Fact-container');
    let val=document.querySelector('.input');
    let button=document.querySelector('button');
    async function Generate(a)
    {
        for(i=0;i<a;i++)
    {
        const result=await fetch("https://meowfacts.herokuapp.com/").then(res=>res.json())
        container.innerHTML+=`<div id="fact">${result.data[0]}</div>`
        console.log(result.data[0],i)
    }
    }
    
    button.addEventListener('click',()=>
    {Generate(val.value)});
    console.log(val.value) ;
});
    </Script>
</html>
